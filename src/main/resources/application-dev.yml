spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loja_veloz_pedidos}
    username: ${DB_USERNAME:loja_veloz}
    password: ${DB_PASSWORD:loja_veloz_dev}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: PedidosHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

    show-sql: true